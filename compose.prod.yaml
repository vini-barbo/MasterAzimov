version: '3.8'

services:
  # Banco de dados PostgreSQL para produção
  database:
    build:
      context: ./DB
      dockerfile: Dockerfile
    container_name: igem-stock-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-igem_stock}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - postgres_backups_prod:/var/lib/postgresql/backups
      - ./DB/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - igem-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-igem_stock}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis para cache e filas em produção
  redis:
    build:
      context: ./CA
      dockerfile: Dockerfile.prod
    container_name: igem-stock-redis-prod
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_MAXMEMORY=${REDIS_MAXMEMORY:-256mb}
      - REDIS_MAXMEMORY_POLICY=${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data_prod:/data
      - redis_logs_prod:/var/log/redis
      - ./CA/config/redis.prod.conf:/etc/redis/redis.conf:ro
      - ./CA/scripts:/usr/local/bin/scripts:ro
    networks:
      - igem-network-prod
    command: ["redis-server", "/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend NestJS para produção
  backend:
    build:
      context: ./BE-IGEMSTOCK
      dockerfile: Dockerfile.prod
    container_name: igem-stock-backend-prod
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB:-igem_stock}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60000}
      RATE_LIMIT_LIMIT: ${RATE_LIMIT_LIMIT:-100}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    networks:
      - igem-network-prod
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
      replicas: 1
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  # Nginx reverse proxy (opcional para produção)
  nginx:
    image: nginx:alpine
    container_name: igem-stock-nginx-prod
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - igem-network-prod
    depends_on:
      - backend
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus - Coleta de métricas (Produção)
  prometheus:
    image: prom/prometheus:latest
    container_name: igem-prometheus-prod
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./Monitor/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./Monitor/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data_prod:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
      - '--web.external-url=http://localhost:9090'
    networks:
      - igem-network-prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana - Visualização de métricas (Produção)
  grafana:
    image: grafana/grafana:latest
    container_name: igem-grafana-prod
    ports:
      - "${GRAFANA_PORT:-3030}:3000"
    volumes:
      - grafana_data_prod:/var/lib/grafana
      - ./Monitor/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./Monitor/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3030}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
    networks:
      - igem-network-prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Node Exporter - Métricas do sistema
  node-exporter:
    image: prom/node-exporter:latest
    container_name: igem-node-exporter-prod
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - igem-network-prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # cAdvisor - Métricas de containers
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: igem-cadvisor-prod
    ports:
      - "${CADVISOR_PORT:-8080}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    networks:
      - igem-network-prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Elasticsearch - Armazenamento de logs (Produção)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: igem-elasticsearch-prod
    environment:
      - node.name=elasticsearch-prod
      - cluster.name=igem-cluster-prod
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=${ELASTICSEARCH_SECURITY_ENABLED:-false}
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data_prod:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    networks:
      - igem-network-prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # Kibana - Visualização de logs (Produção)
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: igem-kibana-prod
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: ${ELASTICSEARCH_USERNAME:-}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      SERVER_NAME: igem-kibana-prod
      SERVER_HOST: "0.0.0.0"
    depends_on:
      - elasticsearch
    networks:
      - igem-network-prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Logstash - Processamento de logs (Produção)
  logstash:
    image: docker.elastic.co/logstash/logstash:8.11.0
    container_name: igem-logstash-prod
    ports:
      - "${LOGSTASH_BEATS_PORT:-5044}:5044"
      - "${LOGSTASH_TCP_PORT:-5000}:5000/tcp"
      - "${LOGSTASH_API_PORT:-9600}:9600"
    volumes:
      - ./Monitor/logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./Monitor/logstash/pipeline:/usr/share/logstash/pipeline:ro
    environment:
      LS_JAVA_OPTS: "-Xmx1g -Xms1g"
      ENVIRONMENT: "production"
    depends_on:
      - elasticsearch
    networks:
      - igem-network-prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 1.5G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Filebeat - Coleta de logs (Produção)
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: igem-filebeat-prod
    user: root
    volumes:
      - ./Monitor/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - filebeat_data_prod:/usr/share/filebeat/data
    environment:
      - output.logstash.hosts=["logstash:5044"]
      - ENVIRONMENT=production
    depends_on:
      - elasticsearch
      - logstash
    networks:
      - igem-network-prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # AlertManager - Gerenciamento de alertas (Produção)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: igem-alertmanager-prod
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./Monitor/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data_prod:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    networks:
      - igem-network-prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.1'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # Jaeger - Distributed Tracing (Produção)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: igem-jaeger-prod
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_COLLECTOR_PORT:-14268}:14268"
      - "${JAEGER_GRPC_PORT:-14250}:14250"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=${JAEGER_STORAGE_TYPE:-memory}
    networks:
      - igem-network-prod
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data_prod:
    driver: local
  postgres_backups_prod:
    driver: local
  redis_data_prod:
    driver: local
  redis_logs_prod:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data_prod:
    driver: local
  grafana_data_prod:
    driver: local
  elasticsearch_data_prod:
    driver: local
  filebeat_data_prod:
    driver: local
  alertmanager_data_prod:
    driver: local

networks:
  igem-network-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Configurações de segurança e monitoramento
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
