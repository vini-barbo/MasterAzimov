input {
  beats {
    port => 5044
  }
  
  tcp {
    port => 5000
    codec => json_lines
  }
  
  udp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # Parse Docker logs
  if [fields][logtype] == "docker" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:message}" }
      overwrite => [ "message" ]
    }
  }
  
  # Parse NestJS logs
  if [fields][service] == "nestjs" {
    json {
      source => "message"
    }
    
    mutate {
      add_field => { "service" => "nestjs-backend" }
    }
  }
  
  # Parse PostgreSQL logs
  if [fields][service] == "postgres" {
    grok {
      match => { "message" => "%{TIMESTAMP_ISO8601:timestamp} %{WORD:timezone} \[%{NUMBER:pid}\] %{LOGLEVEL:level}:  %{GREEDYDATA:message}" }
      overwrite => [ "message" ]
    }
    
    mutate {
      add_field => { "service" => "postgresql" }
    }
  }
  
  # Parse Redis logs
  if [fields][service] == "redis" {
    grok {
      match => { "message" => "%{NUMBER:pid}:%{WORD:role} %{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{GREEDYDATA:message}" }
      overwrite => [ "message" ]
    }
    
    mutate {
      add_field => { "service" => "redis" }
    }
  }
  
  # Parse Nginx logs
  if [fields][service] == "nginx" {
    grok {
      match => { "message" => "%{COMBINEDAPACHELOG}" }
    }
    
    mutate {
      add_field => { "service" => "nginx" }
    }
  }
  
  # Add common fields
  mutate {
    add_field => { "environment" => "${ENVIRONMENT:development}" }
    add_field => { "project" => "master-azimov" }
  }
  
  # Convert timestamp
  if [timestamp] {
    date {
      match => [ "timestamp", "ISO8601" ]
    }
  }
  
  # Clean up fields
  mutate {
    remove_field => [ "agent", "ecs", "input", "log", "host" ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "azimov-logs-%{+YYYY.MM.dd}"
    template_name => "azimov-logs"
    template_pattern => "azimov-logs-*"
    template => {
      "index_patterns" => ["azimov-logs-*"]
      "settings" => {
        "number_of_shards" => 1
        "number_of_replicas" => 0
      }
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" }
          "level" => { "type" => "keyword" }
          "service" => { "type" => "keyword" }
          "environment" => { "type" => "keyword" }
          "message" => { "type" => "text" }
        }
      }
    }
  }
  
  # Debug output
  stdout {
    codec => rubydebug
  }
}
