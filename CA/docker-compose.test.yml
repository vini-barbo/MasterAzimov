version: '3.8'

services:
  redis-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: redis-cache-test
    restart: "no"
    ports:
      - "6380:6379"  # Different port for testing
    environment:
      - REDIS_PASSWORD=
      - REDIS_MAXMEMORY=128mb
      - REDIS_MAXMEMORY_POLICY=allkeys-lru
    volumes:
      - ./config/redis.test.conf:/etc/redis/redis.conf:ro
      - ./scripts:/usr/local/bin/scripts:ro
    networks:
      - redis_test_network
    command: ["redis-server", "/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    tmpfs:
      - /data:noexec,nosuid,size=256m
      - /tmp:noexec,nosuid,size=64m

networks:
  redis_test_network:
    driver: bridge
