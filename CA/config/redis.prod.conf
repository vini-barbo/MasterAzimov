# Redis Configuration for Production
# Network
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 300

# General
daemonize no
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile /var/log/redis/redis-server.log
databases 16

# Snapshotting - More frequent saves for production
save 900 1
save 300 10
save 60 10000
save 15 1000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Replication
slave-serve-stale-data yes
slave-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-ping-slave-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
repl-backlog-size 10mb
repl-backlog-ttl 3600

# Security - Enable in production
requirepass ${REDIS_PASSWORD:-changeme}
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG "CONFIG_b4a1c5e8f9d0"

# Limits - Higher for production
maxclients 65000
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 10

# Append only mode - More conservative for production
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 256mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Lua scripting - More restrictive
lua-time-limit 5000

# Slow log - More sensitive
slowlog-log-slower-than 5000
slowlog-max-len 256

# Latency monitor
latency-monitor-threshold 50

# Event notification
notify-keyspace-events "Ex"

# Hash
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List
list-max-ziplist-size -2
list-compress-depth 1

# Set
set-max-intset-entries 512

# Sorted set
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog
hll-sparse-max-bytes 3000

# Client output buffer limits - Higher for production
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit slave 512mb 128mb 60
client-output-buffer-limit pubsub 64mb 16mb 60

# Client query buffer limit
client-query-buffer-limit 1gb

# Protocol buffer limit
proto-max-bulk-len 512mb

# Frequency - Higher for production
hz 20

# Background saving
aof-rewrite-incremental-fsync yes

# Active rehashing
activerehashing yes

# Memory usage optimization
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 5
active-defrag-cycle-max 75
