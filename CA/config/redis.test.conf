# Redis Configuration for Testing
# Network
bind 127.0.0.1
port 6379
timeout 300
tcp-keepalive 300

# General
daemonize no
pidfile /var/run/redis/redis-server.pid
loglevel notice
logfile ""
databases 16

# Snapshotting - Disabled for testing
save ""
stop-writes-on-bgsave-error no
rdbcompression no
rdbchecksum no
dbfilename dump-test.rdb
dir /tmp

# Security - No password for testing
# requirepass ""

# Limits - Lower for testing
maxclients 1000
maxmemory 128mb
maxmemory-policy allkeys-lru
maxmemory-samples 3

# Append only mode - Disabled for testing
appendonly no

# Lua scripting
lua-time-limit 5000

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 64

# Event notification
notify-keyspace-events ""

# Optimized for testing
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Client limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit slave 64mb 16mb 60
client-output-buffer-limit pubsub 8mb 2mb 60

# Frequency - Lower for testing
hz 10

# Active rehashing
activerehashing no
